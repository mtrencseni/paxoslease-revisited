\* The acceptor-side repair, checked with P2's renewal qualifier dropped.
\* RefuseLiveOverwrite = TRUE makes an acceptor refuse to replace a live
\* lease of a different owner, even under a higher ballot, so an abandoned
\* attempt's late accept requests cannot erase a competitor's record.  Either
\* that rule or the renewal qualifier alone prevents the stale-owner
\* execution.  Passes exhaustively over 2,765,270,158 distinct states
\* (`make staleowner-a2`, recorded in results/staleowner-a2.txt).
SPECIFICATION Spec
CONSTANTS
    Proposers = {p1, p2}
    Acceptors = {a1, a2}
    Ballots = {1, 2, 3}
    NoOwner = NoOwner
    MaxTime = 2
    ProposerDuration = 2
    AcceptorDuration = 2
    Quarantine = 2
    AllowCrash = TRUE
    AllowRelease = FALSE
    AllowDrop = FALSE
    AllowRenewal = FALSE
    AllowAbandon = TRUE
    AllowRedeliver = FALSE
    CrashDropsIncoming = FALSE
    RefuseLiveOverwrite = TRUE
    MaxNetwork = 4
INVARIANT TypeOK
INVARIANT LeaseExclusivity
CONSTRAINT StateConstraint

\* Explicit retry: proposers may abandon an attempt (AbandonAttempt) and
\* retry under a fresh, higher ballot, with the abandoned attempt's messages
\* still in the network, across acceptor crash and restart, at the quarantine
\* boundary Quarantine = ProposerDuration.  Three ballots give a proposer two
\* attempts while its competitor runs a third; MaxNetwork = 4 lets the
\* abandoned attempt's full prepare pair stay in flight beside the fresh one.
SPECIFICATION Spec
CONSTANTS
    Proposers = {p1, p2}
    Acceptors = {a1, a2}
    Ballots = {1, 2, 3}
    NoOwner = NoOwner
    MaxTime = 2
    ProposerDuration = 2
    AcceptorDuration = 2
    Quarantine = 2
    AllowCrash = TRUE
    AllowRelease = FALSE
    AllowDrop = FALSE
    AllowRenewal = FALSE
    AllowAbandon = TRUE
    AllowRedeliver = FALSE
    CrashDropsIncoming = FALSE
    RefuseLiveOverwrite = TRUE
    MaxNetwork = 4
INVARIANT TypeOK
INVARIANT Safety
CONSTRAINT StateConstraint

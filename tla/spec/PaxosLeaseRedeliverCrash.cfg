\* Redelivering transport, full form: every deliver action may leave the
\* message in the network (base module's AllowRedeliver), so any request or
\* response can be delivered again arbitrarily later, across acceptor crash
\* and restart, at the quarantine boundary Quarantine = ProposerDuration.
\* Safe because responses are counted by distinct acceptor identity; the
\* scalar-counting variant (counterexamples/ScalarQuorumCounting.tla) shows
\* the same transport violating exclusivity when votes are counted by
\* message.  Exhaustive but very large; recorded evidence
\* (`make check-redeliver-crash`, results/redeliver-crash.txt).
SPECIFICATION Spec
CONSTANTS
    Proposers = {p1, p2}
    Acceptors = {a1, a2}
    Ballots = {1, 2}
    NoOwner = NoOwner
    MaxTime = 2
    ProposerDuration = 2
    AcceptorDuration = 2
    Quarantine = 2
    AllowCrash = TRUE
    AllowRelease = FALSE
    AllowDrop = FALSE
    AllowRenewal = FALSE
    AllowAbandon = FALSE
    AllowRedeliver = TRUE
    CrashDropsIncoming = FALSE
    RefuseLiveOverwrite = TRUE
    MaxNetwork = 4
INVARIANT TypeOK
INVARIANT Safety
CONSTRAINT StateConstraint

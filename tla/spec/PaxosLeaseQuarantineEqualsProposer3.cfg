\* The (1,2,1) quarantine boundary with three acceptors, symmetry reduced.
SPECIFICATION Spec
CONSTANTS
    Proposers = {p1, p2}
    Acceptors = {a1, a2, a3}
    Ballots = {1, 2}
    NoOwner = NoOwner
    MaxTime = 2
    ProposerDuration = 1
    AcceptorDuration = 2
    Quarantine = 1
    AllowCrash = TRUE
    AllowRelease = FALSE
    AllowDrop = FALSE
    AllowRenewal = FALSE
    AllowAbandon = FALSE
    AllowRedeliver = FALSE
    CrashDropsIncoming = FALSE
    RefuseLiveOverwrite = TRUE
    MaxNetwork = 4
INVARIANT TypeOK
INVARIANT Safety
CONSTRAINT StateConstraint
SYMMETRY Symm

\* Release with two proposers across acceptor crash and restart, two acceptors.
SPECIFICATION Spec
CONSTANTS
    Proposers = {p1, p2}
    Acceptors = {a1, a2}
    Ballots = {1, 2, 3}
    NoOwner = NoOwner
    MaxTime = 2
    ProposerDuration = 2
    AcceptorDuration = 2
    Quarantine = 2
    AllowCrash = TRUE
    AllowRelease = TRUE
    AllowDrop = FALSE
    AllowRenewal = FALSE
    AllowAbandon = FALSE
    AllowRedeliver = FALSE
    CrashDropsIncoming = FALSE
    RefuseLiveOverwrite = TRUE
    MaxNetwork = 4
INVARIANT TypeOK
INVARIANT Safety
CONSTRAINT StateConstraint
